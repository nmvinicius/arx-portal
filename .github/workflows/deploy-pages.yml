name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build (ng build) + máscara/fingerprint do config. A chave AES vem do secret.
      - name: Build
        run: node scripts/build.mjs --base-href=/arx-portal/
        env:
          CONFIG_KEY: ${{ secrets.CONFIG_KEY }}

      # O 404.html faz o fallback de rotas SPA (ex.: /v/ABC12) no Pages.
      - run: cp dist/arx-portal/browser/index.html dist/arx-portal/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/arx-portal/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
